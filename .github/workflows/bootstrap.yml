name: Bootstrap BuildPulse source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded BuildPulse archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -q BuildPulse_Zero_Cost_MVP.zip -d /tmp/buildpulse-install
          test -f /tmp/buildpulse-install/buildpulse_zero/public/index.html
          test -f /tmp/buildpulse-install/buildpulse_zero/scripts/collect.py
          cp -R /tmp/buildpulse-install/buildpulse_zero/. .
          python3 -m unittest discover -s tests -v
      - name: Commit application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md sales_playbook.md public scripts tests sql functions .github/workflows/daily.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Install BuildPulse application from archive'
            git push
          fi
