name: Verify privacy request endpoint
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/privacy-smoke.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Submit synthetic request and verify response
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          url="https://lsryeakefctcsdhasuek.supabase.co/functions/v1/buildthepulse-privacy"
          payload=json.dumps({
            "email":"buildthepulse-automated-check@example.com",
            "request_type":"access",
            "jurisdiction":"California",
            "details":"Synthetic integration test request; may be deleted by operator"
          }).encode()
          request=urllib.request.Request(url,method="POST",data=payload,headers={
            "Content-Type":"application/json",
            "Origin":"https://buildthepulse.onrender.com",
          })
          with urllib.request.urlopen(request,timeout=20) as response:
            body=json.loads(response.read().decode())
            assert response.status==200 and body.get("ok") is True,body
          print("Privacy endpoint accepted synthetic test request.")
          PY
