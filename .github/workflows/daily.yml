name: Refresh permit feeds

on:
  schedule:
    - cron: '18 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/**'
      - 'tests/test_collect*.py'

permissions:
  contents: read

concurrency:
  group: buildpulse-permit-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check public/app.js && node --check public/waitlist-config.js && node --check public/privacy-controls.js && node --check public/privacy-request.js && node --check public/growth.js && node --check public/advertise.js
      - name: Collect Chicago data
        id: chicago
        continue-on-error: true
        run: python scripts/collect.py --days 30
      - name: Collect D.C. data
        id: dc
        continue-on-error: true
        run: python scripts/collect_markets.py --market dc --days 30
      - name: Collect Philadelphia data
        id: philadelphia
        continue-on-error: true
        run: python scripts/collect_markets.py --market philadelphia --days 30
      - name: Collect Delaware data
        id: delaware
        continue-on-error: true
        run: python scripts/collect_markets.py --market delaware
      - name: Collect recent Sussex County permits (optional feed)
        continue-on-error: true
        run: python scripts/collect_sussex.py
      - name: Commit updated public data
        run: |
          git config user.name 'buildpulse-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/permits.json public/data/dc.json public/data/philadelphia.json public/data/delaware.json
          if test -f public/data/sussex.json; then git add public/data/sussex.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Automated permit refresh'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep "$attempt"
            done
            echo 'Could not publish data after 3 attempts' >&2
            exit 1
          fi
      - name: Report failed required feeds
        if: ${{ always() && (steps.chicago.outcome == 'failure' || steps.dc.outcome == 'failure' || steps.philadelphia.outcome == 'failure' || steps.delaware.outcome == 'failure') }}
        run: |
          echo "::error::One or more required feeds failed. Review the collector logs. Prior files are retained for failed feeds."
          exit 1
