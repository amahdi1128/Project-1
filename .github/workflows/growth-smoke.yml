name: Test BuildThePulse growth endpoints
on:
  push:
    paths:
      - '.github/workflows/growth-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser JS syntax
        run: |
          node --check public/app.js
          node --check public/privacy-controls.js
          node --check public/growth.js
          node --check public/advertise.js
      - name: Test private advertiser inquiry, free updates and opt-in event endpoints
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          origin='https://buildthepulse.onrender.com'
          base='https://lsryeakefctcsdhasuek.supabase.co/functions/v1/'
          tests=[
            ('buildthepulse-growth',{
              'kind':'sponsor','company':'BuildThePulse Synthetic Test Co',
              'contact_name':'Synthetic CI Test','email':'buildthepulse-ci-sponsor@example.com',
              'website_url':'https://example.com','market':'chicago',
              'placement':'market','budget':'under_250','notes':'AUTOMATED-CI-REMOVE',
              'consent_to_contact':True}),
            ('buildthepulse-growth',{
              'kind':'event','event_type':'page_view','market':'dc','path':'/',
              'placement':'CI-TEST'}),
            ('buildpulse-waitlist',{
              'email':'buildthepulse-ci-newsletter@example.com',
              'trade':'All trades','company':'Synthetic Test','requested_plan':'not_sure',
              'wants_pilot':False,'consent_to_contact':True,'website':''}),
          ]
          for endpoint,payload in tests:
            req=urllib.request.Request(base+endpoint,data=json.dumps(payload).encode(),
              method='POST',headers={'Content-Type':'application/json','Origin':origin})
            with urllib.request.urlopen(req,timeout=25) as response:
              body=json.load(response)
              assert response.status==200 and body.get('ok') is True,(response.status,body)
            print(endpoint, 'accepted synthetic test')
          req=urllib.request.Request(base+'buildthepulse-growth',
            data=json.dumps(tests[1][1]).encode(),method='POST',
            headers={'Content-Type':'application/json','Origin':'https://malicious.example'})
          try:
            urllib.request.urlopen(req,timeout=20)
            raise AssertionError('Cross-origin request unexpectedly accepted')
          except urllib.error.HTTPError as error:
            assert error.code==403,error.code
          print('Unapproved-origin request rejected')
          PY
